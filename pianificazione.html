<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pianificazione — TimeTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
<style>
:root{--bg:#0F1117;--card:#181B24;--card-hover:#1E2230;--border:#2A2E3B;--text:#E8E9ED;--text-dim:#8B8FA3;--accent:#3A7BE8;--accent-h:#4A8BF8;--red:#E85D3A;--green:#2EAE6D;--orange:#E8A33A;--font:'DM Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono','SF Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
input,select,button,textarea{font-family:var(--font)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Toast */
#toast{position:fixed;top:16px;right:16px;padding:10px 20px;border-radius:8px;color:#fff;font-weight:600;z-index:999;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.4);transform:translateY(-20px);opacity:0;transition:all .25s ease;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;font-weight:700;margin-bottom:18px}
.modal-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.modal-field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.modal-field label{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.modal-field input,.modal-field select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;width:100%}
.modal-field input:focus,.modal-field select:focus{border-color:var(--accent)}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:16px;color:var(--accent);display:flex;align-items:center;gap:6px;text-decoration:none}
.header-right{display:flex;align-items:center;gap:10px}
.btn-primary{background:var(--accent);border:none;color:#fff;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn-primary:hover{background:var(--accent-h)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s}
.btn-outline:hover{color:var(--text);border-color:var(--text-dim)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s}
.btn-danger:hover{background:rgba(232,93,58,.12)}

/* Main */
main{max-width:1400px;margin:0 auto;padding:24px 16px}
.section-title{font-size:18px;font-weight:700;margin:0 0 20px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}

/* Filters bar */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px}
.filters .field-group{display:flex;flex-direction:column;gap:4px;min-width:160px}
.filters label{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.filters select,.filters input[type=text]{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none}
.filters select:focus,.filters input:focus{border-color:var(--accent)}

/* View toggle */
.view-tabs{display:flex;gap:6px;margin-bottom:20px}
.view-tab{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:500;transition:all .15s}
.view-tab:hover{color:var(--text)}
.view-tab.active{background:rgba(58,123,232,.09);border-color:rgba(58,123,232,.27);color:var(--accent)}

/* Gantt override for dark theme */
.gantt-container{background:var(--card);border-radius:10px;padding:16px;overflow-x:auto}
.gantt .grid-background{fill:#181B24}
.gantt .grid-header{fill:#1E2230;stroke:#2A2E3B;stroke-width:1}
.gantt .grid-row{fill:#181B24}
.gantt .grid-row:nth-child(even){fill:#1a1d26}
.gantt .row-line{stroke:#2A2E3B}
.gantt .tick{stroke:#2A2E3B;stroke-width:1}
.gantt .today-highlight{fill:rgba(58,123,232,.08);opacity:1}
.gantt .arrow{fill:none;stroke:var(--text-dim);stroke-width:1.4}
.gantt .bar-label{fill:var(--text);font-size:11px;font-family:var(--font)}
.gantt .lower-text,.gantt .upper-text{fill:var(--text-dim);font-size:11px;font-family:var(--font)}
.gantt .bar-progress{fill:var(--accent)}
.gantt svg{font-family:var(--font)!important}

/* Confronto table */
.compare-table{width:100%;border-collapse:collapse}
.compare-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.compare-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(42,46,59,.5)}
.compare-table tr:hover td{background:rgba(255,255,255,.02)}
.progress-bar{background:var(--bg);border-radius:6px;height:8px;overflow:hidden;min-width:100px}
.progress-fill{height:100%;border-radius:6px;transition:width .4s}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-ok{background:rgba(46,174,109,.15);color:var(--green)}
.badge-warn{background:rgba(232,163,58,.15);color:var(--orange)}
.badge-over{background:rgba(232,93,58,.15);color:var(--red)}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state svg{opacity:.3;margin-bottom:16px}
.empty-state p{font-size:15px;margin-bottom:8px}
.empty-state span{font-size:13px}

/* Task list */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-radius:10px;border:1px solid var(--border);flex-wrap:wrap}
.task-color{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.task-name{font-weight:600;font-size:14px;flex:1;min-width:120px}
.task-meta{font-size:12px;color:var(--text-dim);font-family:var(--mono);display:flex;gap:12px;flex-wrap:wrap}
.task-actions{display:flex;gap:4px;margin-left:auto}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .3s ease}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="toast"></div>
<div id="modal-root"></div>
<div id="sync-status" style="position:fixed;bottom:20px;right:20px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;z-index:9999;background:#888;box-shadow:0 4px 12px rgba(0,0,0,.3)">○ Caricamento...</div>

<header>
  <a href="index.html" class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    TimeTrack
  </a>
  <span style="color:var(--text-dim);font-size:13px">/ Pianificazione</span>
  <div class="header-right">
    <button class="btn-outline" onclick="location.href='index.html'">← Torna al TimeSheet</button>
    <button class="btn-primary" onclick="openTaskModal()">+ Nuova Attività</button>
  </div>
</header>

<main>
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
    <h1 class="section-title" style="margin:0">📅 Pianificazione Commesse</h1>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="field-group">
      <label>Commessa</label>
      <select id="filter-project" onchange="applyFilters()">
        <option value="">Tutte le commesse</option>
      </select>
    </div>
    <div class="field-group">
      <label>Utente</label>
      <select id="filter-user" onchange="applyFilters()">
        <option value="">Tutti gli utenti</option>
      </select>
    </div>
    <div class="field-group">
      <label>Vista Gantt</label>
      <select id="gantt-view-mode" onchange="changeViewMode(this.value)">
        <option value="Day">Giorno</option>
        <option value="Week" selected>Settimana</option>
        <option value="Month">Mese</option>
      </select>
    </div>
  </div>

  <!-- View tabs -->
  <div class="view-tabs">
    <button class="view-tab active" onclick="switchTab('gantt',this)">📊 Gantt</button>
    <button class="view-tab" onclick="switchTab('compare',this)">⚖ Confronto Pianificato / Reale</button>
    <button class="view-tab" onclick="switchTab('list',this)">☰ Lista Attività</button>
  </div>

  <!-- GANTT VIEW -->
  <div id="tab-gantt">
    <div class="card" style="padding:16px">
      <div id="gantt-container" class="gantt-container"></div>
      <div id="gantt-empty" class="empty-state" style="display:none">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <p>Nessuna attività pianificata</p>
        <span>Clicca "+ Nuova Attività" per iniziare</span>
      </div>
    </div>
  </div>

  <!-- COMPARE VIEW -->
  <div id="tab-compare" style="display:none">
    <div class="card">
      <h3 class="section-title" style="font-size:15px;margin-bottom:16px">Ore pianificate vs. ore consuntivate</h3>
      <div id="compare-content"></div>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="tab-list" style="display:none">
    <div class="card">
      <div id="list-content"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.umd.js"></script>
<script>
// ─── Supabase (stesse credenziali di index.html) ───
const SUPABASE_URL='https://latuujorgnaksdhxazfb.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhdHV1am9yZ25ha3NkaHhhemZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMDE5NzIsImV4cCI6MjA5Mzc3Nzk3Mn0.xG3LluYAsPiTdCIVYdBQk1KX70BlhTKTccIzvQ-Xz7Y';
const DB_KEY='timetrack_v5';
let supa=null;
try{supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}

let db=null;
let ganttInstance=null;
let syncTimer=null;
let currentTab='gantt';

// ─── Sync status ───
function setSyncStatus(s){
  const el=document.getElementById('sync-status');
  const colors={ok:'#2EAE6D',sync:'#E8A33A',err:'#E85A4F',off:'#888'};
  const labels={ok:'✓ Sincronizzato',sync:'⟳ Sync...',err:'✗ Errore',off:'○ Offline'};
  el.style.background=colors[s]; el.innerHTML=labels[s];
}

// ─── DB Load/Save (stesso meccanismo di index.html) ───
async function loadDB(){
  setSyncStatus('sync');
  try{
    const r=localStorage.getItem(DB_KEY);
    if(r){db=JSON.parse(r);}
  }catch(e){}
  if(!db){setSyncStatus('off');return;}

  if(supa){
    try{
      const {data,error}=await supa.from('timetrack_data').select('data').eq('id',1).single();
      if(!error&&data?.data){
        db=data.data;
        localStorage.setItem(DB_KEY,JSON.stringify(db));
        setSyncStatus('ok');
      } else { setSyncStatus('ok'); }
    }catch(e){setSyncStatus('err');}
  } else { setSyncStatus('off'); }

  if(!db.pianificazione) db.pianificazione=[];
  init();
}

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
  localStorage.setItem(DB_KEY+'_savedAt',Date.now().toString());
  localStorage.setItem(DB_KEY+'_pending','1');
  if(supa){
    if(syncTimer)clearTimeout(syncTimer);
    setSyncStatus('sync');
    syncTimer=setTimeout(async()=>{
      try{
        await supa.from('timetrack_data').upsert({id:1,data:db,updated_at:new Date().toISOString()});
        setSyncStatus('ok');
        localStorage.removeItem(DB_KEY+'_pending');
      }catch(e){setSyncStatus('err');}
    },800);
  }
}

// ─── Toast ───
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='ok'?'#2EAE6D':type==='err'?'#E85D3A':'#E8A33A';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── ID generator ───
function genId(){return 'pi_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}

// ─── Helpers ───
function getProject(id){return db.projects?.find(p=>p.id===id)}
function getUser(id){return db.users?.find(u=>u.id===id)}
function getActivity(proj,actId){return proj?.activities?.find(a=>a.id===actId)}
function fmtDate(d){if(!d)return '—'; const dt=new Date(d); return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})}
function isoToday(){return new Date().toISOString().slice(0,10)}
function addDays(iso,n){const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

// ─── Color palette for bars ───
const COLORS=['#3A7BE8','#2EAE6D','#E8A33A','#9B59B6','#E85D3A','#1ABC9C','#E91E8C','#F39C12'];
function projectColor(projectId){
  const idx=db.projects?.findIndex(p=>p.id===projectId)??0;
  return COLORS[idx%COLORS.length];
}

// ─── Filter helpers ───
function filteredTasks(){
  let tasks=db.pianificazione||[];
  const fp=document.getElementById('filter-project')?.value;
  const fu=document.getElementById('filter-user')?.value;
  if(fp) tasks=tasks.filter(t=>t.projectId===fp);
  if(fu) tasks=tasks.filter(t=>t.userId===fu||(!t.userId&&fu===''));
  return tasks;
}

// ─── Init ───
function init(){
  populateFilters();
  renderCurrentTab();
}

function populateFilters(){
  const fp=document.getElementById('filter-project');
  const fu=document.getElementById('filter-user');
  fp.innerHTML='<option value="">Tutte le commesse</option>';
  (db.projects||[]).forEach(p=>{
    fp.innerHTML+=`<option value="${p.id}">[${p.code}] ${p.name}</option>`;
  });
  fu.innerHTML='<option value="">Tutti gli utenti</option>';
  (db.users||[]).forEach(u=>{
    fu.innerHTML+=`<option value="${u.id}">${u.name}</option>`;
  });
}

function applyFilters(){renderCurrentTab()}

function switchTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-gantt').style.display=tab==='gantt'?'block':'none';
  document.getElementById('tab-compare').style.display=tab==='compare'?'block':'none';
  document.getElementById('tab-list').style.display=tab==='list'?'block':'none';
  renderCurrentTab();
}

function renderCurrentTab(){
  if(currentTab==='gantt') renderGantt();
  else if(currentTab==='compare') renderCompare();
  else renderList();
}

// ─── GANTT ───
function renderGantt(){
  const tasks=filteredTasks();
  const container=document.getElementById('gantt-container');
  const empty=document.getElementById('gantt-empty');

  if(!tasks.length){
    container.innerHTML='';
    container.style.display='none';
    empty.style.display='block';
    ganttInstance=null;
    return;
  }
  container.style.display='block';
  empty.style.display='none';

  const ganttTasks=tasks.map(t=>{
    const proj=getProject(t.projectId);
    const act=getActivity(proj,t.activityId);
    const user=getUser(t.userId);
    const label=[proj?`[${proj.code}]`:'',act?.name||t.name||'Attività'].filter(Boolean).join(' ');
    const realHours=getRealHours(t);
    const progress=t.orePreviste>0?Math.min(100,Math.round(realHours/t.orePreviste*100)):0;
    return {
      id: t.id,
      name: label+(user?` · ${user.name.split(' ')[0]}`:''),
      start: t.dataInizio,
      end: t.dataFine,
      progress,
      custom_class: '',
    };
  });

  container.innerHTML='';
  try{
    const viewMode=document.getElementById('gantt-view-mode').value||'Week';
    ganttInstance=new Gantt('#gantt-container',ganttTasks,{
      view_mode: viewMode,
      date_format: 'YYYY-MM-DD',
      language: 'it',
      bar_height: 28,
      bar_corner_radius: 4,
      padding: 18,
      on_click: task=>{
        const t=db.pianificazione.find(x=>x.id===task.id);
        if(t) openTaskModal(t);
      },
      on_date_change:(task,start,end)=>{
        const t=db.pianificazione.find(x=>x.id===task.id);
        if(t){
          t.dataInizio=start.toISOString().slice(0,10);
          t.dataFine=end.toISOString().slice(0,10);
          saveDB();
        }
      },
      custom_popup_html: task=>{
        const t=db.pianificazione.find(x=>x.id===task.id);
        if(!t)return '';
        const proj=getProject(t.projectId);
        const act=getActivity(proj,t.activityId);
        const user=getUser(t.userId);
        const real=getRealHours(t);
        const pct=t.orePreviste>0?Math.round(real/t.orePreviste*100):0;
        return `<div style="padding:12px;min-width:200px;font-family:DM Sans,sans-serif;font-size:13px">
          <strong style="font-size:14px">${act?.name||t.name||'Attività'}</strong><br>
          <span style="color:#8B8FA3">${proj?`[${proj.code}] ${proj.name}`:''}</span><br>
          ${user?`<span style="color:#8B8FA3">👤 ${user.name}</span><br>`:''}
          <div style="margin-top:8px;display:flex;gap:16px">
            <span>📅 ${fmtDate(t.dataInizio)} → ${fmtDate(t.dataFine)}</span>
          </div>
          <div style="margin-top:6px">
            ⏱ Previste: <strong>${t.orePreviste}h</strong> &nbsp;|&nbsp;
            Reali: <strong style="color:${pct>100?'#E85D3A':pct>80?'#E8A33A':'#2EAE6D'}">${real}h</strong>
            (${pct}%)
          </div>
          ${t.note?`<div style="margin-top:6px;color:#8B8FA3;font-style:italic">${t.note}</div>`:''}
        </div>`;
      }
    });
    // Force dark background on SVG
    const svg=container.querySelector('svg');
    if(svg){svg.style.background='#181B24';}
  }catch(e){
    container.innerHTML=`<p style="color:var(--red);padding:20px">Errore Gantt: ${e.message}</p>`;
  }
}

function changeViewMode(mode){
  if(ganttInstance) ganttInstance.change_view_mode(mode);
  else renderGantt();
}

// ─── COMPARE ───
function getRealHours(task){
  return (db.entries||[]).filter(e=>{
    const byProj=e.projectId===task.projectId;
    const byAct=!task.activityId||e.activityId===task.activityId;
    const byUser=!task.userId||e.userId===task.userId;
    const inRange=(!task.dataInizio||e.date>=task.dataInizio)&&(!task.dataFine||e.date<=task.dataFine);
    return byProj&&byAct&&byUser&&inRange;
  }).reduce((s,e)=>s+(parseFloat(e.hours)||0),0);
}

function renderCompare(){
  const tasks=filteredTasks();
  const el=document.getElementById('compare-content');
  if(!tasks.length){
    el.innerHTML=`<div class="empty-state"><p>Nessuna attività pianificata</p></div>`;
    return;
  }
  let html=`<div style="overflow-x:auto"><table class="compare-table">
    <thead><tr>
      <th>Commessa</th><th>Attività</th><th>Utente</th><th>Periodo</th>
      <th style="text-align:right">Previste</th><th style="text-align:right">Reali</th>
      <th style="min-width:140px">Avanzamento</th><th>Stato</th><th></th>
    </tr></thead><tbody>`;
  tasks.forEach(t=>{
    const proj=getProject(t.projectId);
    const act=getActivity(proj,t.activityId);
    const user=getUser(t.userId);
    const real=getRealHours(t);
    const pct=t.orePreviste>0?Math.min(100,Math.round(real/t.orePreviste*100)):0;
    const over=real>t.orePreviste;
    const warn=pct>=80&&!over;
    const color=over?'var(--red)':warn?'var(--orange)':'var(--green)';
    const badge=over?'badge-over':warn?'badge-warn':'badge-ok';
    const label=over?'Sforato':warn?'Attenzione':'In linea';
    html+=`<tr>
      <td><strong>${proj?`[${proj.code}]`:''}</strong> ${proj?.name||'—'}</td>
      <td>${act?.name||t.name||'—'}</td>
      <td>${user?.name||'—'}</td>
      <td style="font-family:var(--mono);font-size:12px;color:var(--text-dim)">${fmtDate(t.dataInizio)} → ${fmtDate(t.dataFine)}</td>
      <td style="text-align:right;font-family:var(--mono);font-weight:700">${t.orePreviste}h</td>
      <td style="text-align:right;font-family:var(--mono);font-weight:700;color:${color}">${real}h</td>
      <td>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        <span style="font-size:11px;color:var(--text-dim);font-family:var(--mono)">${pct}%</span>
      </td>
      <td><span class="badge ${badge}">${label}</span></td>
      <td>
        <button class="btn-outline" style="padding:4px 10px;font-size:12px" onclick="openTaskModal(${JSON.stringify(t).replace(/"/g,'&quot;')})">✎ Modifica</button>
      </td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  el.innerHTML=html;
}

// ─── LIST ───
function renderList(){
  const tasks=filteredTasks();
  const el=document.getElementById('list-content');
  if(!tasks.length){
    el.innerHTML=`<div class="empty-state"><p>Nessuna attività pianificata</p><button class="btn-primary" style="margin-top:16px" onclick="openTaskModal()">+ Nuova Attività</button></div>`;
    return;
  }
  let html=`<div class="task-list">`;
  tasks.forEach(t=>{
    const proj=getProject(t.projectId);
    const act=getActivity(proj,t.activityId);
    const user=getUser(t.userId);
    const real=getRealHours(t);
    const color=projectColor(t.projectId);
    html+=`<div class="task-item">
      <div class="task-color" style="background:${color}"></div>
      <div class="task-name">${act?.name||t.name||'Attività'}</div>
      <div class="task-meta">
        <span>${proj?`[${proj.code}] ${proj.name}`:''}</span>
        ${user?`<span>👤 ${user.name}</span>`:''}
        <span>📅 ${fmtDate(t.dataInizio)} → ${fmtDate(t.dataFine)}</span>
        <span>⏱ ${real}h / ${t.orePreviste}h</span>
        ${t.note?`<span style="font-style:italic;color:var(--text-dim)">${t.note}</span>`:''}
      </div>
      <div class="task-actions">
        <button class="btn-outline" style="padding:4px 10px;font-size:12px" onclick="openTaskModal(${JSON.stringify(t).replace(/"/g,'&quot;')})">✎</button>
        <button class="btn-danger" onclick="deleteTask('${t.id}')">✕</button>
      </div>
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

// ─── Modal Nuova/Modifica Attività ───
function openTaskModal(task=null){
  const isEdit=!!task?.id;
  const projects=db.projects||[];
  const users=db.users||[];

  const firstProjId=projects[0]?.id||'';
  const selProjId=task?.projectId||firstProjId;
  const selProj=getProject(selProjId);

  let projOptions=projects.map(p=>`<option value="${p.id}" ${selProjId===p.id?'selected':''}>[${p.code}] ${p.name} — ${db.clients?.find(c=>c.id===p.clientId)?.name||''}</option>`).join('');
  let actOptions=(selProj?.activities||[]).map(a=>`<option value="${a.id}" ${task?.activityId===a.id?'selected':''}>${a.name}</option>`).join('');
  let userOptions='<option value="">— Nessuno —</option>'+users.map(u=>`<option value="${u.id}" ${task?.userId===u.id?'selected':''}>${u.name}</option>`).join('');

  const today=isoToday();
  const html=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>${isEdit?'✎ Modifica Attività':'+ Nuova Attività Pianificata'}</h3>
      <div class="modal-field">
        <label>Commessa</label>
        <select id="m-project" onchange="onModalProjectChange(this.value)">${projOptions}</select>
      </div>
      <div class="modal-field">
        <label>Attività</label>
        <select id="m-activity">${actOptions}</select>
      </div>
      <div class="modal-field">
        <label>Utente (opzionale)</label>
        <select id="m-user">${userOptions}</select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="modal-field">
          <label>Data inizio</label>
          <input type="date" id="m-start" value="${task?.dataInizio||today}">
        </div>
        <div class="modal-field">
          <label>Data fine</label>
          <input type="date" id="m-end" value="${task?.dataFine||addDays(today,7)}">
        </div>
      </div>
      <div class="modal-field">
        <label>Ore previste</label>
        <input type="number" id="m-hours" min="0.5" step="0.5" value="${task?.orePreviste||8}" placeholder="es. 40">
      </div>
      <div class="modal-field">
        <label>Note (opzionale)</label>
        <input type="text" id="m-note" value="${task?.note||''}" placeholder="opzionale">
      </div>
      <div class="modal-actions">
        ${isEdit?`<button class="btn-danger" onclick="deleteTask('${task.id}')">Elimina</button>`:''}
        <button class="btn-outline" onclick="closeModal()">Annulla</button>
        <button class="btn-primary" onclick="saveTask(${isEdit?`'${task.id}'`:null})">${isEdit?'Salva':'Aggiungi'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-root').innerHTML=html;
}

function onModalProjectChange(projId){
  const proj=getProject(projId);
  const sel=document.getElementById('m-activity');
  if(!sel)return;
  sel.innerHTML=(proj?.activities||[]).map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
}

function saveTask(editId=null){
  const projId=document.getElementById('m-project').value;
  const actId=document.getElementById('m-activity').value;
  const userId=document.getElementById('m-user').value||null;
  const start=document.getElementById('m-start').value;
  const end=document.getElementById('m-end').value;
  const hours=parseFloat(document.getElementById('m-hours').value)||0;
  const note=document.getElementById('m-note').value.trim();

  if(!projId){showToast('Seleziona una commessa','err');return;}
  if(!start||!end){showToast('Inserisci date inizio e fine','err');return;}
  if(end<start){showToast('La data fine deve essere dopo la data inizio','err');return;}
  if(hours<=0){showToast('Inserisci ore previste > 0','err');return;}

  if(!db.pianificazione) db.pianificazione=[];

  if(editId){
    const idx=db.pianificazione.findIndex(t=>t.id===editId);
    if(idx>=0){
      db.pianificazione[idx]={...db.pianificazione[idx],projectId:projId,activityId:actId,userId,dataInizio:start,dataFine:end,orePreviste:hours,note};
    }
  } else {
    db.pianificazione.push({id:genId(),projectId:projId,activityId:actId,userId,dataInizio:start,dataFine:end,orePreviste:hours,note});
  }

  saveDB();
  closeModal();
  showToast(editId?'Attività aggiornata':'Attività aggiunta');
  renderCurrentTab();
}

function deleteTask(id){
  if(!confirm('Eliminare questa attività pianificata?'))return;
  db.pianificazione=(db.pianificazione||[]).filter(t=>t.id!==id);
  saveDB();
  closeModal();
  showToast('Attività eliminata','warn');
  renderCurrentTab();
}

function closeModal(){document.getElementById('modal-root').innerHTML='';}

// ─── Boot ───
loadDB();
</script>
</body>
</html>
